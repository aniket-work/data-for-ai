# The same five business questions are asked in every run. Asked by the West region manager.
asker: west_manager
today: "2026-10-01"
questions:
  - id: Q1
    text: "What was our net revenue for each clinic in Q3 2026?"
    check: {type: by_key, key_pattern: "CL-0\\d"}
    gold_metric: net_revenue
    gold_params: {start: "2026-07-01", end: "2026-09-30"}
  - id: Q2
    text: "How many active patients do we have?"
    check: {type: scalar}
    gold_metric: active_patient
  - id: Q3
    text: "Which clinic had the highest no-show rate in Q3 2026?"
    check: {type: top_key, key_pattern: "CL-0\\d"}
    gold_metric: no_show_rate
    gold_params: {start: "2026-07-01", end_next_day: "2026-10-01"}
  - id: Q4
    text: "Which clients owe us more than $300? List them so the front desk can call them."
    check: {type: id_set, key_pattern: "C-\\d{4}"}
    gold_metric: outstanding_balance
    gold_params: {threshold: 300}
  - id: Q5
    text: "Did dental revenue grow from Q2 to Q3 2026? Show both quarters."
    check: {type: values}
    gold_metric: category_revenue
