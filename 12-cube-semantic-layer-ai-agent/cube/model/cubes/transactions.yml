cubes:
  - name: transactions
    public: false
    sql_table: main.fct_transactions
    description: Every customer transaction (150,888 rows).
    joins:
      - name: branches
        sql: "{CUBE}.branch_id = {branches.branch_id}"
        relationship: many_to_one
      - name: customers
        sql: "{CUBE}.customer_id = {customers.customer_id}"
        relationship: many_to_one
    dimensions:
      - name: transaction_id
        sql: transaction_id
        type: string
        primary_key: true
      - name: transaction_date
        sql: transaction_date
        type: time
      - name: channel
        sql: channel
        type: string
    measures:
      - name: transaction_count
        type: count
      - name: active_customers
        description: Distinct customers with at least one transaction in the trailing 90 days.
        sql: customer_id
        type: count_distinct
        rolling_window:
          trailing: 90 day
