      or services.
    type: categorical
  - name: contract_id
    expr: contract_id
    description: contract_id represents a unique identifier for each contract between the organization and a supplier.
    type: categorical
  - name: supplier_tier
    expr: supplier_tier
    description: supplier_tier represents the classification level of the supplier based on their importance or relationship.
    type: categorical
  - name: country
    expr: country
    description: country represents the country where the supplier is based.
    type: categorical
  - name: product_category
    expr: category
    description: category represents the type of products or services the supplier provides.
    type: categorical
  - name: region
    expr: region
    description: region represents the geographical region the supplier is associated with.
    type: categorical
  - name: supplier_name
    expr: supplier_name
    description: supplier_name represents the official name of the supplier.
    type: categorical
  - name: onboarded_date
    expr: onboarded_date
    description: "onboarded_date represents the date when the supplier was added to the organization's system. \u2014 format:\
      \ YYYY-MM-DD"
    type: time
    type_params:
      time_granularity: day
- name: product
