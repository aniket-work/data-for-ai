  type: simple
  type_params:
    measure: actual_units_sum
  config:
    meta:
      synonyms: []
- name: abs_forecast_error_units_sum
  label: abs forecast error units sum
  description: Helper for abs_forecast_error_units_sum.
  type: simple
  type_params:
    measure: abs_forecast_error_units_sum
- name: actual_units_sum
  label: actual units sum
  description: Helper for actual_units_sum.
  type: simple
  type_params:
    measure: actual_units_sum
- name: forecast_wape
  label: forecast wape
