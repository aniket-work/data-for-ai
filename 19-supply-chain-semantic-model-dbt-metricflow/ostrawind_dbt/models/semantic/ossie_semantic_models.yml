  - name: unit_price
    expr: unit_price
    description: unit_price represents the selling price of the product per unit.
    type: categorical
  - name: abc_class
    expr: abc_class
    description: abc_class categorizes the product into A, B, or C based on its importance or value.
    type: categorical
  - name: product_name
    expr: product_name
    description: product_name describes the specific name or type of the product.
    type: categorical
  - name: lead_time_in_days
    expr: lead_time_days
    description: lead_time_days indicates the number of days required to receive the product from the supplier.
    type: categorical
  - name: unit_cost
    expr: unit_cost
    description: unit_cost represents the cost price of the product per unit.
