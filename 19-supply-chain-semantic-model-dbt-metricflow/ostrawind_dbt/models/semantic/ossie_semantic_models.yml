  config:
    meta:
      synonyms: []
- name: on_time_delivery_rate
  label: on time delivery rate
  description: 'On-time delivery (OTD): received purchase order lines whose receipt date is on or before the promised date,
    divided by received purchase order lines. Contract SLA targets are 92% (Pangrove Polymer), 95% (Kessling Fastener) and
    88% (Siravan Hydraulics).'
  type: simple
  type_params:
    measure: is_on_time_average
  config:
    meta:
      synonyms:
      - OTD
      - on-time delivery
      - OTD rate
      - supplier on-time rate
      - delivery reliability
- name: units_received
  label: units received
  description: Good units received.
  type: simple
  type_params:
    measure: quantity_received_sum
  config:
    meta:
      synonyms: []
- name: total_damaged_units
  label: total damaged units
  description: Units received damaged.
  type: simple
  type_params:
    measure: damaged_units_sum
  config:
    meta:
      synonyms: []
- name: damaged_units_sum
  label: damaged units sum
  description: Helper for damaged_units_sum.
  type: simple
  type_params:
    measure: damaged_units_sum
- name: units_shipped_sum
  label: units shipped sum
  description: Helper for units_shipped_sum.
  type: simple
  type_params:
    measure: units_shipped_sum
- name: damage_rate
  label: damage rate
  description: Damaged units divided by units shipped. Pangrove Polymer's contract caps it at 0.5% per quarter.
  type: ratio
  type_params:
    numerator: damaged_units_sum
    denominator: units_shipped_sum
  config:
    meta:
      synonyms:
      - damage percentage
      - defect rate in transit
- name: received_qty_on_receipt_sum
  label: received qty on receipt sum
  description: Helper for received_qty_on_receipt_sum.
  type: simple
  type_params:
    measure: received_qty_on_receipt_sum
- name: ordered_qty_on_receipt_sum
  label: ordered qty on receipt sum
  description: Helper for ordered_qty_on_receipt_sum.
  type: simple
  type_params:
    measure: ordered_qty_on_receipt_sum
- name: fill_rate
  label: fill rate
  description: Units received divided by units ordered, over received purchase order lines. Contract targets are 97-99%.
  type: ratio
  type_params:
    numerator: received_qty_on_receipt_sum
    denominator: ordered_qty_on_receipt_sum
  config:
    meta:
      synonyms:
      - order fill rate
      - unit fill rate
- name: total_freight_cost
  label: total freight cost
