- name: purchase_order
  description: A record representing a purchase order placed by a buyer.
  model: ref('purchase_order')
  config:
    meta:
      synonyms:
      - PO
      - purchase order line
      - replenishment order
      - buy order
  entities:
  - name: purchase_order
    type: primary
    expr: po_id
  - name: supplier
    type: foreign
    expr: supplier_id
  - name: product
    type: foreign
    expr: sku
  - name: warehouse
    type: foreign
    expr: warehouse_id
  dimensions:
  - name: purchase_order_status
    expr: po_status
    description: po_status represents the current status of the purchase order, such as Closed, In Transit, Cancelled, or
      Open.
    type: categorical
  - name: unit_cost
    expr: unit_cost
    description: unit_cost represents the cost per unit of the product ordered.
    type: categorical
  - name: promised_delivery_date
    expr: promised_date
    description: "promised_date represents the expected date by which the product should be delivered. \u2014 format: YYYY-MM-DD"
    type: time
    type_params:
      time_granularity: day
  - name: order_date
    expr: order_date
    description: "order_date represents the date when the purchase order was placed. \u2014 format: YYYY-MM-DD"
    type: time
    type_params:
      time_granularity: day
  - name: quantity_ordered
    expr: quantity_ordered
    description: quantity_ordered represents the number of units ordered in the purchase order.
    type: categorical
  - name: quantity_received
    expr: quantity_received
    description: Units received in good condition against the purchase order line.
    type: categorical
  - name: received_date
    expr: received_date
    description: Date the purchase order line was received at the warehouse. Empty while open.
    type: time
    type_params:
      time_granularity: day
  - name: is_on_time
    expr: CASE WHEN received_date IS NULL THEN NULL WHEN received_date <= promised_date THEN 1 ELSE 0 END
    description: 1 when the purchase order was received on or before its promised date, 0 when received late, empty while
      not received.
    type: categorical
  - name: is_received
    expr: CASE WHEN received_date IS NOT NULL THEN 1 ELSE 0 END
    description: 1 when the purchase order has a receipt date.
    type: categorical
  - name: received_qty_on_receipt
    expr: CASE WHEN received_date IS NOT NULL THEN quantity_received END
    description: Units received, for received purchase orders only.
    type: categorical
  - name: ordered_qty_on_receipt
    expr: CASE WHEN received_date IS NOT NULL THEN quantity_ordered END
    description: Units ordered, for received purchase orders only (fill-rate denominator).
    type: categorical
  - name: po_value
    expr: quantity_ordered * unit_cost
    description: Purchase order value, ordered units times unit cost (USD).
    type: categorical
  defaults:
    agg_time_dimension: promised_delivery_date
  measures:
  - name: po_id_count
    agg: count
    expr: po_id
  - name: quantity_ordered_sum
    agg: sum
    expr: quantity_ordered
  - name: po_value_sum
    agg: sum
    expr: quantity_ordered * unit_cost
  - name: is_received_sum
    agg: sum
    expr: CASE WHEN received_date IS NOT NULL THEN 1 ELSE 0 END
  - name: is_on_time_sum
    agg: sum
    expr: CASE WHEN received_date IS NULL THEN NULL WHEN received_date <= promised_date THEN 1 ELSE 0 END
  - name: is_on_time_average
    agg: average
    expr: CASE WHEN received_date IS NULL THEN NULL WHEN received_date <= promised_date THEN 1 ELSE 0 END
  - name: received_qty_on_receipt_sum
    agg: sum
    expr: CASE WHEN received_date IS NOT NULL THEN quantity_received END
  - name: ordered_qty_on_receipt_sum
    agg: sum
    expr: CASE WHEN received_date IS NOT NULL THEN quantity_ordered END
- name: shipment
  description: Core entity representing a shipment, including its identification, timeline, and status.
  model: ref('shipment')
  config:
    meta:
      synonyms:
      - inbound shipment
      - delivery
      - receipt
      - consignment
  entities:
  - name: shipment
    type: primary
    expr: shipment_id
  - name: purchase_order
    type: foreign
    expr: po_id
  - name: carrier
    type: foreign
    expr: carrier_id
  dimensions:
  - name: delivery_date
    expr: delivered_date
    description: "delivered_date records the date when the shipment was successfully delivered. \u2014 format: YYYY-MM-DD"
    type: time
    type_params:
      time_granularity: day
  - name: shipment_date
    expr: ship_date
    description: "ship_date records the date when the shipment was dispatched. \u2014 format: YYYY-MM-DD"
    type: time
    type_params:
      time_granularity: day
  - name: shipment_status
    expr: shipment_status
    description: shipment_status indicates the current status of the shipment, such as 'Delivered' or 'In Transit'.
    type: categorical
  - name: freight_cost
    expr: freight_cost
    description: freight_cost represents the total cost incurred for transporting the shipment, expressed in currency.
    type: categorical
  - name: damaged_units
    expr: damaged_units
    description: damaged_units represents the number of units that were damaged upon delivery.
    type: categorical
  - name: quantity_received
    expr: quantity_received
    description: quantity_received represents the total number of units received from the shipment.
    type: categorical
  - name: units_shipped
    expr: quantity_received + damaged_units
    description: Units that arrived, good plus damaged.
    type: categorical
  - name: transit_days
    expr: CASE WHEN delivered_date IS NOT NULL THEN delivered_date - ship_date END
    description: Days from ship date to delivered date.
    type: categorical
  defaults:
    agg_time_dimension: delivery_date
  measures:
  - name: shipment_id_count
    agg: count
    expr: shipment_id
  - name: quantity_received_sum
    agg: sum
    expr: quantity_received
  - name: damaged_units_sum
    agg: sum
    expr: damaged_units
  - name: units_shipped_sum
    agg: sum
    expr: quantity_received + damaged_units
  - name: freight_cost_sum
    agg: sum
    expr: freight_cost
  - name: transit_days_average
    agg: average
    expr: CASE WHEN delivered_date IS NOT NULL THEN delivered_date - ship_date END
- name: inventory_snapshot
  description: A record representing the state of inventory at a specific point in time for a particular warehouse and product.
  model: ref('inventory_snapshot')
  config:
    meta:
      synonyms:
      - stock snapshot
      - inventory position
      - stock on hand
  entities:
  - name: inventory_snapshot
    type: primary
    expr: snapshot_id
  - name: product
    type: foreign
    expr: sku
  - name: warehouse
    type: foreign
    expr: warehouse_id
  dimensions:
  - name: snapshot_date
    expr: snapshot_date
    description: "snapshot_date represents the date on which the inventory snapshot was taken. \u2014 format: YYYY-MM-DD"
    type: time
    type_params:
      time_granularity: day
  - name: allocated_units
    expr: allocated_units
    description: allocated_units represents the number of units of a product that have been reserved for orders or commitments.
    type: categorical
  - name: reorder_point_units
    expr: reorder_point_units
    description: reorder_point_units represents the inventory level at which a product should be reordered to avoid stockouts.
    type: categorical
  - name: on_hand_units
    expr: on_hand_units
    description: on_hand_units represents the number of units of a product currently available in the warehouse.
    type: categorical
  - name: safety_stock_units
    expr: safety_stock_units
    description: safety_stock_units represents the minimum number of units that should always be kept in stock to mitigate
      supply chain risks.
    type: categorical
  - name: available_units
    expr: on_hand_units - allocated_units
    description: On-hand units minus units allocated to open customer orders (logistics policy LOG-POL-7).
    type: categorical
  - name: is_stockout
    expr: CASE WHEN on_hand_units - allocated_units <= 0 THEN 1 ELSE 0 END
    description: 1 when available units are zero (a stockout under LOG-POL-7).
    type: categorical
  - name: is_below_safety_stock
    expr: CASE WHEN on_hand_units - allocated_units < safety_stock_units THEN 1 ELSE 0 END
    description: 1 when available units are under safety stock units.
    type: categorical
  defaults:
    agg_time_dimension: snapshot_date
  measures:
  - name: on_hand_units_average
    agg: average
    expr: on_hand_units
  - name: available_units_sum
    agg: sum
    expr: on_hand_units - allocated_units
  - name: snapshot_id_count
    agg: count
    expr: snapshot_id
  - name: is_stockout_sum
    agg: sum
    expr: CASE WHEN on_hand_units - allocated_units <= 0 THEN 1 ELSE 0 END
  - name: is_stockout_average
    agg: average
    expr: CASE WHEN on_hand_units - allocated_units <= 0 THEN 1 ELSE 0 END
  - name: is_below_safety_stock_average
    agg: average
    expr: CASE WHEN on_hand_units - allocated_units < safety_stock_units THEN 1 ELSE 0 END
- name: demand_forecast
  description: A record representing a forecast of demand for a specific product in a specific warehouse for a given month.
  model: ref('demand_forecast')
  config:
    meta:
      synonyms:
      - forecast
      - demand plan
      - forecast vs actual
  entities:
  - name: demand_forecast
    type: primary
    expr: forecast_id
  - name: product
    type: foreign
    expr: sku
  - name: warehouse
    type: foreign
    expr: warehouse_id
  dimensions:
  - name: forecast_month
    expr: forecast_month
    description: "The month for which the forecast is made. \u2014 format: YYYY-MM-DD"
    type: time
    type_params:
      time_granularity: day
  - name: actual_units
    expr: actual_units
    description: The actual number of units sold or available compared to the forecast.
    type: categorical
  - name: forecasted_units
    expr: forecast_units
    description: The number of units predicted to be available or sold in the forecast month.
    type: categorical
  - name: abs_forecast_error_units
    expr: ABS(actual_units - forecast_units)
    description: Absolute difference between actual and forecast units (closed months only).
    type: categorical
  - name: forecast_minus_actual_units
    expr: CASE WHEN actual_units IS NOT NULL THEN forecast_units - actual_units END
    description: Forecast minus actual units for closed months (positive = over-forecast).
    type: categorical
  defaults:
    agg_time_dimension: forecast_month
  measures:
  - name: forecasted_units_sum
    agg: sum
    expr: forecast_units
  - name: actual_units_sum
    agg: sum
    expr: actual_units
  - name: abs_forecast_error_units_sum
    agg: sum
    expr: ABS(actual_units - forecast_units)
  - name: forecast_minus_actual_units_sum
    agg: sum
    expr: CASE WHEN actual_units IS NOT NULL THEN forecast_units - actual_units END
- name: carrier_lane_performance
  description: Records of carrier performance metrics across different lanes and months
  model: ref('carrier_lane_performance')
  config:
    meta:
      synonyms:
      - carrier scorecard
      - lane performance
      - carrier KPI
  entities:
  - name: carrier_lane_performance
    type: primary
    expr: performance_id
  - name: carrier
    type: foreign
    expr: carrier_id
  dimensions:
  - name: total_shipments
    expr: shipments
    description: The shipments column represents the total number of shipments processed during the performance month.
    type: categorical
  - name: performance_month
    expr: performance_month
    description: "The performance_month represents the specific month during which the performance metrics were recorded.\
      \ \u2014 format: YYYY-MM-DD"
    type: time
    type_params:
      time_granularity: day
  - name: damage_claims
    expr: damage_claims
    description: The damage_claims column represents the number of claims filed due to damage during the performance month.
    type: categorical
  - name: on_time_shipments
    expr: on_time_shipments
    description: The on_time_shipments column represents the number of shipments that were delivered on time during the performance
      month.
    type: categorical
  - name: average_transit_days
    expr: avg_transit_days
    description: The avg_transit_days column represents the average number of days it took for shipments to transit between
      ports during the performance month.
    type: categorical
  - name: lane
    expr: lane
    description: The lane column indicates the route or connection between two ports or cities, such as Ho Chi Minh-Vancouver.
    type: categorical
  defaults:
    agg_time_dimension: performance_month
  measures:
  - name: on_time_shipments_sum
    agg: sum
    expr: on_time_shipments
  - name: total_shipments_sum
    agg: sum
    expr: shipments
  - name: damage_claims_sum
    agg: sum
    expr: damage_claims
