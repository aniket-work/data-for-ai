      - forecast error
- name: forecast_minus_actual_units_sum
  label: forecast minus actual units sum
  description: Helper for forecast_minus_actual_units_sum.
  type: simple
  type_params:
    measure: forecast_minus_actual_units_sum
- name: forecast_bias
  label: forecast bias
  description: (Forecast - actual) / actual over closed months. Positive means over-forecasting.
  type: ratio
  type_params:
    numerator: forecast_minus_actual_units_sum
    denominator: actual_units_sum
  config:
