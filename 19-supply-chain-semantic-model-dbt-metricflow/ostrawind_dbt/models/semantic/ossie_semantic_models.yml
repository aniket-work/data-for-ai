version: 2
semantic_models:
- name: supplier
  description: Core information about a supplier, including identifiers, contact details, and classification.
  model: ref('supplier')
  config:
    meta:
      synonyms:
      - vendor
      - supplier master
      - source of supply
  entities:
  - name: supplier
    type: primary
    expr: supplier_id
  dimensions:
